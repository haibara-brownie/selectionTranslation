[workspace]
members = ["crates/seltrans-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# 核心 crate 和界面层共用同一批依赖版本，免得两边漂移
[workspace.dependencies]
async-channel = "2.5.0"
futures-util = "0.3.34"
jiff = "0.2.35"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[package]
name = "seltrans"
version.workspace = true
edition.workspace = true

[dependencies]
seltrans-core = { path = "crates/seltrans-core" }

adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_18"] }
ksni = "0.3.6"

async-channel = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
