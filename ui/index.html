<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>划词翻译</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./dropdown.css" />
    <!-- 调色板与字体分档由 Rust 生成后注入，见 popup.ts -->
    <style id="theme"></style>
  </head>
  <body>
    <div class="shell">
      <!-- 顶栏：整条都可拖动窗口，按钮除外 -->
      <header class="topbar" data-tauri-drag-region>
        <button id="retranslate" class="icon-btn" title="重新翻译（Ctrl+Enter）">↻</button>

        <div class="spacer"></div>

        <div class="chip" title="翻译风格">
          <select id="prompt"></select>
        </div>

        <div class="spacer"></div>

        <button id="copy" class="icon-btn" title="复制译文（Ctrl+C）">⧉</button>
        <button id="settings" class="icon-btn" title="设置">⚙</button>
        <button id="close" class="icon-btn danger" title="关闭（Esc）">✕</button>
      </header>

      <main class="content">
        <div class="section-head">
          <span class="section-title">原文</span>
          <span id="src-count" class="count"></span>
        </div>
        <div class="card">
          <textarea
            id="source"
            spellcheck="false"
            placeholder="在这里输入或粘贴要翻译的内容，Ctrl+Enter 翻译"
          ></textarea>
        </div>

        <div class="section-head">
          <span class="section-title">译文</span>
          <span id="spinner" class="spinner" hidden></span>
        </div>
        <div class="card grow">
          <div id="output" class="output"></div>
        </div>
      </main>

      <footer class="statusbar">
        <div class="chip" title="模型">
          <select id="model"></select>
        </div>
        <span id="status" class="status"></span>
      </footer>

      <!--
        首次使用提示。默认 hidden，由 popup.ts 按 UiState.onboarding 决定要不要显示。

        条目文字**不写死在这里**：里面要嵌真实的快捷键，而三个平台默认值不同、
        用户还能自己改（见 T-13 的约束 1）。一份说谎的教程比没有更糟。

        刻意不铺满窗口，也不拦住底下的翻译 —— 译文照常跑，点掉就能看见结果。
      -->
      <div id="onboard" class="onboard" hidden>
        <div class="onboard-card">
          <h2 id="onboard-title">怎么用</h2>
          <ul id="onboard-tips"></ul>
          <button id="onboard-ok" class="btn-primary">我会用</button>
        </div>
      </div>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
