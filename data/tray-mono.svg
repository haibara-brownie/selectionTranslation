<?xml version="1.0" encoding="UTF-8"?>
<!--
  macOS 菜单栏模板图标的唯一矢量源。

  模板图标只认 alpha，系统负责按浅色/深色菜单栏上色，所以这里不复制彩色应用图标。
  选区条和外扩角标保留应用图标轮廓，箭头用透明镂空保证 16/22pt 下仍能读清。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <mask id="selection" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
    <rect width="24" height="24" fill="#000"/>
    <rect x="4" y="8" width="16" height="8" rx="2" fill="#fff"/>
    <path d="M3 10V7h3M21 14v3h-3" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 12h8m-3-3 3 3-3 3" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <rect width="24" height="24" fill="#000" mask="url(#selection)"/>
</svg>
