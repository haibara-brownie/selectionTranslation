<!--
  macOS 菜单栏用的模板图标（单色）。

  为什么要单独一份：模板图标**只认 alpha 通道**，系统按明暗主题自己上色。彩色那份
  (xyz.brownie.SelectionTranslation.svg) 的字形是浅色实心填充，alpha 是满的，直接当模板
  会变成两坨看不出内容的黑块——tray.rs 的注释早就预判过这件事。

  所以这里把字形**挖成洞**（mask 里涂黑），让形体靠镂空来读。

  还有一处不能省：两只气泡在彩色版里靠色相区分，单色下会糊成一块。前面那只先挖一圈
  比自己大 1.6 的缝、再画本体，两只之间就有了一道透明的分隔线。

  几何数据逐字取自彩色版，改图标时两份要一起改。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
    <rect width="48" height="48" fill="#000"/>

    <!-- 后面那只气泡 -->
    <path d="M11 24 h8 l-11 9 Z" fill="#fff"/>
    <rect x="2.5" y="3" width="32" height="23" rx="7" fill="#fff"/>
    <!-- 「A」挖空 -->
    <path fill="#000" d="M11.493252361673415 22.5H14.732118758434549L15.854925775978408 18.397435897435898H21.01551956815115L22.138326585695008 22.5H25.506747638326587L20.389338731443996 6.5H16.610661268556008ZM16.545883940620783 15.914304993252362 17.020917678812417 14.165317139001349C17.49595141700405 12.502699055330634 17.94939271255061 10.6889338731444 18.381241565452093 8.939946018893387H18.46761133603239C18.94264507422402 10.645748987854251 19.374493927125506 12.502699055330634 19.871120107962213 14.165317139001349L20.346153846153847 15.914304993252362Z"/>

    <!-- 前面那只气泡：先挖一圈缝，再画本体，免得两只糊成一块 -->
    <rect x="11.9" y="20.4" width="35.2" height="25.2" rx="8.6" fill="#000"/>
    <path d="M37 42 h8 l-4 6 Z" fill="#fff"/>
    <rect x="13.5" y="22" width="32" height="22" rx="7" fill="#fff"/>
    <!-- 「文」挖空 -->
    <path fill="#000" d="M28.58490566037736 26.14465408805032C28.946540880503143 26.820754716981135 29.30817610062893 27.716981132075475 29.4811320754717 28.36163522012579H22.79874213836478V30.201257861635227H25.28301886792453C26.132075471698112 32.418238993710695 27.232704402515722 34.320754716981135 28.647798742138363 35.89308176100629C27.0125786163522 37.16666666666667 24.968553459119498 38.06289308176101 22.5 38.676100628930826C22.87735849056604 39.11635220125787 23.443396226415093 39.99685534591195 23.647798742138363 40.45283018867925C26.17924528301887 39.71383647798743 28.30188679245283 38.66037735849057 30.047169811320757 37.24528301886793C31.71383647798742 38.644654088050316 33.742138364779876 39.682389937106926 36.22641509433962 40.34276729559749C36.509433962264154 39.82389937106919 37.075471698113205 39.00628930817611 37.5 38.58176100628931C35.12578616352201 38.04716981132076 33.144654088050316 37.10377358490567 31.50943396226415 35.86163522012579C32.90880503144654 34.33647798742139 33.977987421383645 32.46540880503145 34.77987421383648 30.201257861635227H37.20125786163522V28.36163522012579H30.345911949685537L31.68238993710692 27.937106918238996C31.4937106918239 27.292452830188683 31.02201257861635 26.286163522012583 30.59748427672956 25.54716981132076ZM30.07861635220126 34.57232704402516C28.867924528301884 33.33018867924529 27.92452830188679 31.85220125786164 27.232704402515722 30.201257861635227H32.672955974842765C32.02830188679245 31.930817610062896 31.179245283018865 33.37735849056604 30.07861635220126 34.57232704402516Z"/>
  </mask>

  <!-- 模板图标只有 alpha 有意义，颜色随便给个黑 -->
  <rect width="48" height="48" fill="#000" mask="url(#m)"/>
</svg>
