<?xml version="1.0" encoding="UTF-8"?>
<!--
  托盘小尺寸专用的彩色图标（Linux 的 ksni 在 22 / 32 两档用它）。

  **为什么不直接缩应用图标：** 应用图标是按 128 设计的，外层留了 8 单位安全边距，
  选区条里排着「A→文」三个字形。缩到 22 像素时，安全边距吃掉两侧各 1.4 像素，
  三个字形总共只分到约 12 个物理像素 —— 平均每字 4 像素，「文」必然糊成一团，
  四角括号退化成噪点。实测确认过。

  所以小尺寸换一套构图：去掉安全边距（面板自己会留白）、去掉角标、去掉字形，
  只留「选区条 + 箭头」这个母题 —— 和 macOS 菜单栏那份单色图同构，
  两个平台的托盘看起来是同一个东西。

  48 / 64 那两档仍用应用图标本身，那个尺寸放得下全部细节。
  配色取自应用图标，改色时两份一起改。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <rect x="1" y="1" width="22" height="22" rx="5.5" fill="#1c2421"/>
  <rect x="4" y="7" width="16" height="10" rx="3" fill="#72deb8"/>
  <path d="M8 12h7m-2.8-2.8 2.8 2.8-2.8 2.8" fill="none" stroke="#1c2421"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
